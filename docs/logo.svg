<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="t">
  <title id="t">VibeSync logo: a glowing screen with a music pulse running through it</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120b2a"/>
      <stop offset="1" stop-color="#04161f"/>
    </linearGradient>
    <linearGradient id="beam" x1="214" y1="0" x2="810" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c6cff"/>
      <stop offset=".5" stop-color="#ff4fa0"/>
      <stop offset="1" stop-color="#00d6be"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="soft"/>
      <feMerge><feMergeNode in="soft"/><feMergeNode in="soft"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="40" y="40" width="944" height="944" rx="230"/></clipPath>
  </defs>
  <rect x="40" y="40" width="944" height="944" rx="230" fill="url(#tile)"/>
  <g clip-path="url(#clip)" filter="url(#glow)">
    <rect x="237" y="313" width="550" height="398" rx="80" fill="none" stroke="url(#beam)" stroke-width="46"/>
    <polyline points="262,512 380,512 424,452 470,600 520,382 572,646 618,470 652,512 762,512"
              fill="none" stroke="url(#beam)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
  </g>
  <polyline points="262,512 380,512 424,452 470,600 520,382 572,646 618,470 652,512 762,512"
            fill="none" stroke="#fff" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
